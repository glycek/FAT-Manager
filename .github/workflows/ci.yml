name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake build-essential

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt6 cmake

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt6)

      - name: List available MinGW packages
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Run aqt list-qt commands
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0
          echo "--- Available Architectures for Qt 6.5.3 ---"
          python -m aqt list-qt windows desktop --arch 6.5.3
          echo "--- Available Modules for Qt 6.5.3 mingw_64 ---"
          python -m aqt list-qt windows desktop --modules 6.5.3 mingw_64
